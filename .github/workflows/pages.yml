name: Deploy to GitHub Pages

# Publishes main to the root of the gh-pages branch, which GitHub Pages serves
# ("Deploy from a branch"). Pull request previews live beside it in
# pr-preview/ (see preview.yml and HANDOVER.md "Deployment").

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # push to the gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
